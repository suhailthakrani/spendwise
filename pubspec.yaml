name: spendwise
description: "Offline expense tracker — SpendWise by EvenLogix."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  fl_chart: ^0.70.2
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_svg: ^2.0.17
  flutter_riverpod: ^2.6.1
  drift: ^2.26.0
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.7
  image_picker: ^1.2.2
  csv: ^6.0.0
  excel: ^4.0.6
  share_plus: ^12.0.2
  flutter_secure_storage: ^10.3.1
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.9.4
  flutter_native_splash: ^2.4.4
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800

flutter_native_splash:
  color: "#041B1F"
  image: assets/images/spendwise_splash.png
  color_dark: "#041B1F"
  image_dark: assets/images/spendwise_splash.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#041B1F"
    icon_background_color: "#041B1F"
    image: assets/images/spendwise_splash.png
    color_dark: "#041B1F"
    icon_background_color_dark: "#041B1F"
    image_dark: assets/images/spendwise_splash.png
  ios: true
  android: true
  fullscreen: true
